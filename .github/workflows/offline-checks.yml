name: Offline safety checks

on:
  push:
    branches:
      - main
      - feat/worker-seat-lifecycle-20261013
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  userscript:
    name: Userscript build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Build and test (offline fixtures)
        run: npm run check
      - name: Ensure checked-in generated script is up to date
        run: git diff --exit-code -- dist/hebut-chaoxing-seat-helper.user.js

  worker:
    name: Worker types, tests and SQLite integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install exact dependencies without lifecycle scripts
        working-directory: worker
        run: npm ci --ignore-scripts
      - name: Typecheck, unit tests and dry-run workerd tests
        working-directory: worker
        run: npm run check
